name: CI

on:
  push:
    branches: [develop, "integration/**", "t1-**"]
  pull_request:
    branches: [develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Pack smoke (tarball installs and the bin runs via its symlink)
        run: |
          pnpm pack --pack-destination /tmp/pack
          cd /tmp/pack
          npm init -y >/dev/null
          npm install --silent ./*.tgz
          ./node_modules/.bin/probe --help | grep -q "Usage: probe"

  docker:
    # Build-but-never-push smoke: catches Dockerfile rot between releases.
    # The push itself (release-gated GHCR publish) is ticket #23.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/edwardseoj/probe:ci .
      - name: Entrypoint smoke (build only; nothing is pushed)
        run: "docker run --rm ghcr.io/edwardseoj/probe:ci --help | grep -q 'Usage: probe'"
